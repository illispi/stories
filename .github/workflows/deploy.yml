name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Audit, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail on high/critical advisories in runtime dependencies
      - run: pnpm audit --prod --audit-level high

      - run: pnpm check

      - run: pnpm build

  publish-docker-hub:
    name: Publish image to Docker Hub
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: illispi/stories:latest
          # Public build-time values only; runtime secrets are set on the server
          build-args: |
            PUBLIC_SITE=https://poll.delvis.org
            PUBLIC_UMAMI_ID=77657924-9c0f-47e6-9bd1-a282a883c2c9
            PUBLIC_SENTRY_DSN=https://3a32bedf009e401cbf2249d2b82e97bb@glitchtip.delvis.org/1
          cache-from: type=gha
          cache-to: type=gha,mode=max
