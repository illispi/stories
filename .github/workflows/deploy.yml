name: Deploy

# - Pull requests and pushes to main: audit, type-check, build, and build the Docker image
#   (not pushed), so a broken Dockerfile shows up before a release.
# - Pushing a version tag (e.g. v1.4.0): the same, then push the image and upload source maps
#   to Sentry.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

# The workflow only reads the repository; Docker Hub and Sentry use their own tokens
permissions:
  contents: read

jobs:
  check:
    name: Audit, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail on high/critical advisories in runtime dependencies
      - run: pnpm audit --prod --audit-level high

      - run: pnpm check

      - run: pnpm build

  docker:
    name: Docker image (published for version tags)
    needs: check
    runs-on: ubuntu-latest
    env:
      # Push and upload source maps only for version tags, never for plain commits or PRs
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tags: the version (1.4.0), major.minor (1.4) and latest. Pre-releases (v1.5.0-rc.1)
      # get only their own version tag, never latest or 1.5.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: illispi/stories
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - if: env.RELEASE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public build-time values only; runtime secrets are set on the server
          build-args: |
            PUBLIC_SITE=https://poll.delvis.org
            PUBLIC_CF_ANALYTICS_TOKEN=${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ github.ref_name }}
          # BuildKit secret (not a build arg), so the token never ends up in the image.
          # Only release builds get it; other builds skip the source map upload.
          secrets: |
            sentry_auth_token=${{ env.RELEASE == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha
          # Pull requests (possibly from forks) only read the cache
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
