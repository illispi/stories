name: Deploy

# - Pull requests and pushes to main: audit, type-check and build (no image).
# - Pushing a version tag (e.g. v1.4.0): the same checks, then build and push the image.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  check:
    name: Audit, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail on high/critical advisories in runtime dependencies
      - run: pnpm audit --prod --audit-level high

      - run: pnpm check

      - run: pnpm build

  publish-docker-hub:
    name: Publish image to Docker Hub
    needs: check
    # Only for version tags, never for plain commits
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tags the image with the version (1.4.0, 1.4) and latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: illispi/stories
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public build-time values only; runtime secrets are set on the server
          build-args: |
            PUBLIC_SITE=https://poll.delvis.org
            PUBLIC_UMAMI_ID=77657924-9c0f-47e6-9bd1-a282a883c2c9
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
